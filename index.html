<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi-hole DNS Activity Mini Card</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.62);
        --muted2: rgba(255, 255, 255, 0.4);
        --ok: #34d399;
        --bad: #fb7185;
        --accent: #0ea5a4;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        padding: 14px;
        display: grid;
        place-items: center;
        color: var(--text);
        background:
          radial-gradient(1100px 700px at 20% 10%, rgba(52, 211, 153, 0.1), transparent 60%),
          radial-gradient(800px 600px at 80% 20%, rgba(59, 130, 246, 0.1), transparent 60%),
          var(--bg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      }

      .app {
        width: min(420px, 100vw);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      header {
        padding: 12px 14px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.1);
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .sub {
        margin-top: 3px;
        font-size: 11px;
        color: var(--muted);
        font-weight: 520;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.05);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.18);
      }

      main {
        padding: 12px 14px 14px;
        display: grid;
        gap: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 14px;
        padding: 10px;
        min-height: 76px;
        display: grid;
        gap: 6px;
      }

      .k {
        font-size: 11px;
        color: var(--muted);
        font-weight: 560;
      }

      .v {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      .mini {
        font-size: 11px;
        color: var(--muted2);
        font-weight: 520;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .wide {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 14px;
        padding: 10px;
        display: grid;
        gap: 8px;
      }

      canvas {
        width: 100%;
        height: 54px;
        display: block;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }

      .label {
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
        color: var(--muted);
        font-weight: 560;
      }

      .value {
        font-size: 12px;
        font-weight: 650;
        color: rgba(255, 255, 255, 0.86);
        white-space: nowrap;
      }

      footer {
        padding: 10px 14px 12px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted2);
        font-size: 10px;
        background: rgba(0, 0, 0, 0.1);
      }

      canvas#spark {
        width: 100%;
        height: 54px;
        display: block;
        border-radius: 10px;
        background:
          linear-gradient(rgba(34, 197, 94, 0.12) 1px, transparent 1px) 0 0 / 100% 12px,
          linear-gradient(90deg, rgba(34, 197, 94, 0.12) 1px, transparent 1px) 0 0 / 12px 100%,
          radial-gradient(500px 120px at 50% 50%, rgba(34, 197, 94, 0.1), transparent 60%),
          #05080f;
        box-shadow:
          inset 0 0 0 1px rgba(34, 197, 94, 0.18),
          0 0 18px rgba(34, 197, 94, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="app" role="application" aria-label="Pi-hole DNS kiosk">
      <header>
        <div>
          <h1>Pi-Hole DNS Activity - <span id="piholeIp">-</span></h1>
          <div class="sub">Mini card • updates every <span id="pollMs">2000</span>ms</div>
        </div>
        <div class="status" title="API status">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </header>

      <main>
        <div class="wide">
          <div class="mini">
            <div class="v" id="qpm">—</div>
            <span>&nbspQueries (per minute)</span>
          </div>
          <canvas id="spark" width="460" height="54"></canvas>
        </div>
        <div class="wide">
          <div class="row">
            <div class="label">DNS queries</div>
            <div class="value" id="dnsTotal">—</div>
          </div>
          <div class="row">
            <div class="label">Blocked</div>
            <div class="value" id="dnsBlocked">—</div>
          </div>
          <div class="row">
            <div class="label">Domains on lists</div>
            <div class="value" id="domainsBlocked">—</div>
          </div>
        </div>
      </main>

      <footer>
        <div>Local DNS dashboard • kiosk mode</div>
        <div id="lastUpdate">Last update: —</div>
      </footer>
    </div>

    <script>
      const POLL_MS = 2000;
      const SPARK_POINTS = 60;

      const $ = (id) => document.getElementById(id);
      $("pollMs").textContent = String(POLL_MS);

      let sid = null;
      let sidExpiry = 0; // epoch ms
      const PIHOLE = "http://127.0.0.1"; // Pi-hole web host
      let aid = "";

      async function login() {
        const r = await fetch(`${PIHOLE}/api/auth`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: aid }),
          cache: "no-store",
        });
        const j = await r.json();
        if (!j?.session?.valid) throw new Error("Auth failed");
        sid = j.session.sid;
        sidExpiry = Date.now() + j.session.validity * 1000 - 10_000; // refresh 10s early
      }

      async function fetchSummary() {
        if (!sid || Date.now() >= sidExpiry) await login();

        const r = await fetch(`${PIHOLE}/api/stats/summary`, {
          headers: { "X-FTL-SID": sid },
          cache: "no-store",
        });

        if (r.status === 401) {
          sid = null;
          await login();
          return fetchSummary();
        } else {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        }
      }

      let lastDnsToday = null;
      let lastTs = null;
      const series = [];

      function setStatus(ok, msg) {
        const dot = $("statusDot");
        dot.style.background = ok ? "var(--ok)" : "var(--bad)";
        dot.style.boxShadow = ok
          ? "0 0 0 3px rgba(52,211,153,.18)"
          : "0 0 0 3px rgba(251,113,133,.18)";
        $("statusText").textContent = msg;
      }

      function num(x) {
        const v = Number(x);
        return Number.isFinite(v) ? v : null;
      }

      function fmtInt(x) {
        const v = num(x);
        return v === null ? "—" : Math.round(v).toLocaleString("en-US");
      }

      function drawSpark(values) {
        const c = $("spark");
        const ctx = c.getContext("2d");

        const w = c.width;
        const h = c.height;
        ctx.clearRect(0, 0, w, h);

        // Keep your existing subtle fill (you can remove if you rely only on CSS canvas background)
        ctx.fillStyle = "rgba(255,255,255,0.03)";
        ctx.fillRect(0, 0, w, h);

        if (!values.length) return;

        const max = Math.max(...values, 1);
        const min = Math.min(...values, 0);
        const pad = 6;
        const innerW = w - pad * 2;
        const innerH = h - pad * 2;

        // baseline
        ctx.strokeStyle = "rgba(255,255,255,0.10)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad, h - pad);
        ctx.lineTo(w - pad, h - pad);
        ctx.stroke();

        // build points once
        const pts = [];
        for (let i = 0; i < values.length; i++) {
          const x = pad + (i / (values.length - 1 || 1)) * innerW;
          const t = (values[i] - min) / (max - min || 1);
          const y = h - pad - t * innerH;
          pts.push({ x, y });
        }

        // helper: smooth stroke via quadratic midpoints
        function strokeSmooth(style, width, shadowBlur, shadowColor) {
          ctx.save();
          ctx.strokeStyle = style;
          ctx.lineWidth = width;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowBlur = shadowBlur;
          ctx.shadowColor = shadowColor;

          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);

          for (let i = 1; i < pts.length - 1; i++) {
            const cx = (pts[i].x + pts[i + 1].x) / 2;
            const cy = (pts[i].y + pts[i + 1].y) / 2;
            ctx.quadraticCurveTo(pts[i].x, pts[i].y, cx, cy);
          }

          // last segment
          if (pts.length > 1) {
            ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          }

          ctx.stroke();
          ctx.restore();
        }

        // glow pass (thicker, translucent)
        strokeSmooth(
          "rgba(34,197,94,0.25)", // glow color
          6, // width
          14, // blur
          "rgba(34,197,94,0.65)", // glow
        );

        // main trace (thin, bright)
        strokeSmooth(
          "rgba(34,197,94,0.95)", // trace color
          2, // width
          6, // blur
          "rgba(34,197,94,0.55)", // glow
        );

        // last dot
        const lastPt = pts[pts.length - 1];
        ctx.fillStyle = "rgba(34,197,94,0.95)";
        ctx.beginPath();
        ctx.arc(lastPt.x, lastPt.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      function update(s) {
        const queries = s?.queries;
        if (!queries || typeof queries !== "object") {
          throw new Error("Unexpected API response format");
        }

        const dnsTotal = num(queries.total);
        const dnsBlocked = num(queries.blocked);
        const domains = num(queries.unique_domains);

        $("dnsTotal").textContent = fmtInt(dnsTotal);
        $("dnsBlocked").textContent = fmtInt(dnsBlocked);
        $("domainsBlocked").textContent = fmtInt(domains);

        const now = Date.now();
        if (dnsTotal !== null) {
          if (lastDnsToday !== null && lastTs !== null) {
            const diff = Math.max(0, dnsTotal - lastDnsToday);
            const dt = Math.max(1, (now - lastTs) / 1000);
            const perMin = (diff / dt) * 60;
            $("qpm").textContent = fmtInt(perMin);

            series.push(diff);
            while (series.length > SPARK_POINTS) series.shift();
            drawSpark(series);
          } else {
            $("qpm").textContent = "—";
          }
          lastDnsToday = dnsTotal;
          lastTs = now;
        }

        setStatus(true, "API OK");
        $("lastUpdate").textContent = "Last update: " + new Date().toLocaleTimeString();
      }

      async function tick() {
        try {
          const s = await fetchSummary();
          update(s);
        } catch (err) {
          const msg = err instanceof Error ? err.message : String(err);
          console.log("Error:", msg, err);
          setStatus(false, "API error");
          $("lastUpdate").textContent = "Last update: error";
        }
      }

      async function loadText(path) {
        const r = await fetch(path, { cache: "no-store" });
        if (!r.ok) {
          throw new Error(`${path} returned HTTP ${r.status}`);
        }
        return (await r.text()).trim();
      }

      async function bootstrap() {
        try {
          const ip = await loadText("/ip.txt");
          document.getElementById("piholeIp").textContent = ip || "-";
        } catch (err) {
          const msg = err instanceof Error ? err.message : String(err);
          console.log("Error:", msg, err);
        }

        try {
          aid = await loadText("/aid.txt");
          if (!aid) {
            setStatus(false, "Missing aid.txt");
            $("lastUpdate").textContent = "Last update: waiting for credentials";
            return;
          }
          tick();
          setInterval(tick, POLL_MS);
        } catch (err) {
          const msg = err instanceof Error ? err.message : String(err);
          console.log("Error:", msg, err);
          setStatus(false, "Bootstrap error");
          $("lastUpdate").textContent = "Last update: bootstrap error";
        }
      }

      bootstrap().catch((err) => {
        const msg = err instanceof Error ? err.message : String(err);
        console.log("Error:", msg, err);
      });
    </script>
  </body>
</html>
